<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#194363">
<meta name="description" content="Asisten Guru SD - absensi, data siswa, file dan laporan offline">
<link rel="manifest" href="manifest.webmanifest">
<title>Asisten Guru</title>
<style>
:root{--blue:#194363;--blue2:#245b80;--bg:#f2f6f9;--ink:#172b3a;--muted:#637786;--line:#dce6ed;--white:#fff;--green:#16784a;--red:#a63838}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;padding:22px 18px 18px}
header .brand{font-size:22px;font-weight:800;letter-spacing:.2px}header p{margin:4px 0 0;color:#d9e8f2;font-size:13px}
nav{display:flex;overflow:auto;background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
nav button{border:0;background:white;color:#526777;padding:14px 13px;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent}
nav button.active{color:var(--blue);border-color:var(--blue)}
main{max-width:760px;margin:auto;padding:16px 14px 40px}
h1{font-size:21px;margin:5px 0 12px}h2{font-size:17px;margin:18px 0 10px}
.card{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #183d5510}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:25px;color:var(--blue)}.stat span{font-size:12px;color:var(--muted)}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px;color:#405767}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd9e2;border-radius:10px;background:white;font:inherit;color:var(--ink)}
button,.btn{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:white;font:700 14px system-ui;text-decoration:none;display:inline-block}
button.secondary,.btn.secondary{background:#e8f0f5;color:var(--blue)}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:7px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .fit{flex:0 0 auto}
.student,.fileitem{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.student:last-child,.fileitem:last-child{border:0}.student .name,.fileitem .name{flex:1;min-width:0;overflow-wrap:anywhere}
.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:#edf3f7;color:#35556a}
.attrow{padding:12px 0;border-bottom:1px solid var(--line)}.attrow strong{display:block;margin-bottom:8px}
.choices{display:flex;gap:6px;flex-wrap:wrap}.choices button{padding:8px 10px;background:#edf2f5;color:#405767}.choices button.chosen{background:var(--blue);color:white}
.muted{color:var(--muted);font-size:13px}.empty{padding:18px;text-align:center;color:var(--muted)}
.notice{background:#fff8e8;border:1px solid #f0dfb8;border-radius:12px;padding:12px;font-size:13px;color:#72531b}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="brand">📚 ASISTEN GURU</div><p>Administrasi Guru Sekolah Dasar • Simpan lokal di perangkat</p></header>
<nav id="nav">
<button data-tab="home" class="active">Beranda</button><button data-tab="students">Data Siswa</button><button data-tab="attendance">Absensi</button><button data-tab="files">File Saya</button><button data-tab="report">Laporan</button>
</nav>
<main id="app"></main>
<footer>Asisten Guru • Data tersimpan di perangkat ini</footer>
<script src="app.js"></script>
</body></html>
